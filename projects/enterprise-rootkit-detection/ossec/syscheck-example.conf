<!--
OSSEC FILE INTEGRITY MONITORING EXAMPLE
Use this as a reference for the <syscheck> section of ossec.conf.
Validate paths and scan frequency for the lab before enabling.
Do not blindly replace an existing ossec.conf.
-->

<syscheck>
    <!-- Periodic integrity scan interval -->
    <frequency>3600</frequency>

    <!-- Security-relevant Linux paths -->
    <directories check_all="yes">/etc</directories>
    <directories check_all="yes">/usr/local/bin</directories>
    <directories check_all="yes">/usr/local/sbin</directories>

    <!-- Lab-controlled application/configuration path -->
    <directories check_all="yes">/opt/lab-suspicious</directories>

    <!-- Ignore volatile/runtime paths -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/random-seed</ignore>
</syscheck>
